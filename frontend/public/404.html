<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>找不到頁面 — 股票分析練習紀錄</title>
    <script>
      // GitHub Pages SPA fallback：將深層路徑改寫並導回首頁
      // 預留給未來引入 react-router 時使用，目前單頁 tab 切換不會觸發此頁。
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, "", redirect);
      } else {
        location.replace("/");
      }
    </script>
  </head>
  <body>
    <p>正在返回首頁…</p>
  </body>
</html>
